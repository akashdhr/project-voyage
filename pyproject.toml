[project]
name = "project-voyage"
version = "0.1.0"
description = "Agentic Flight Research & Price Optimization Engine"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.12.0",
    "pydantic>=2.0.0",
    "textual>=0.52.0",
    "tavily-python>=0.3.3",
    "python-dotenv>=1.0.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.2.0",
    "langgraph>=0.1.0",
    "langchain-nvidia-ai-endpoints>=0.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
